# CodeBuild: test, build, push, deploy. Tests gate the build (infrastructure.md §2.4 item 7) —
# a failing suite must stop the pipeline, never warn and continue.
version: 0.2

env:
  variables:
    UV_LINK_MODE: copy          # CodeBuild's cache and workspace are on different filesystems
    AWS_REGION: us-east-1
    ECR_REPO: earshot

phases:
  install:
    runtime-versions:
      python: 3.13
      nodejs: 22
    commands:
      - curl -LsSf https://astral.sh/uv/0.9.3/install.sh | sh
      - export PATH="$HOME/.local/bin:$PATH"
      - uv sync --frozen

  pre_build:
    commands:
      # Lint and test BEFORE the image build, so a broken commit fails in ~1 min not ~5.
      - uv run ruff check src tests tools benchmarks
      - uv run pytest
      - aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
      # Tag by commit sha: the digest promoted to demo must be traceable to a commit.
      - export IMAGE_TAG="${CODEBUILD_RESOLVED_SOURCE_VERSION:0:12}"

  build:
    commands:
      - docker build -t "$ECR_REGISTRY/$ECR_REPO:$IMAGE_TAG" .
      - docker push "$ECR_REGISTRY/$ECR_REPO:$IMAGE_TAG"
      # Resolve the immutable digest — CDK deploys the digest, never the tag, so a retag
      # cannot change what is already deployed.
      - export IMAGE_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$ECR_REGISTRY/$ECR_REPO:$IMAGE_TAG")
      - cd ui && npm ci && npm run build && cd ..

  post_build:
    commands:
      - cd infra && npm ci
      - uv sync --frozen --group infra
      - npx cdk deploy "Earshot/${STAGE:-dev}/*" --require-approval never -c imageDigest="$IMAGE_DIGEST"

artifacts:
  files:
    - imagedefinitions.json
  discard-paths: yes
