# PARKED — THIS FILE HAS NEVER RUN AND CANNOT RUN AS WRITTEN. Read this before believing it.
#
# CodeBuild and CodePipeline are blocked on the `iam:CreateRole` denial (W9, progress.md), so
# nothing has ever executed this. Do not read it as evidence of a CI pipeline: the tests are
# real and green, but what runs them is `.github/workflows/ci.yml`, not this.
#
# Three things here are stale against decisions already taken, and are left in place rather than
# quietly corrected because the file is a record of a design that was superseded, not a plan:
#
#   * `npx cdk deploy` and `cd infra` contradict D-024 (2026-08-25) — CDK does not work in this
#     account and `tools/provision.py` + `tools/deploy.py` are the path. There is no `infra/`.
#   * `docker build` against a container image contradicts D-024's second half; the Lambdas ship
#     as one zip. A `Dockerfile` exists but nothing deployed uses it.
#   * `cd ui && npm ci && npm run build` cannot run: the UI is deliberately build-step-free
#     (D-004) and there is no `ui/package.json`.
#
# Rewriting it to match D-024 would mean writing a CodeBuild spec for a pipeline that is still
# blocked and therefore still untestable — a second unrun file, with the same problem and less
# history. When W9 unblocks, rewrite it then, against the deploy path that actually exists.
version: 0.2

env:
  variables:
    UV_LINK_MODE: copy          # CodeBuild's cache and workspace are on different filesystems
    AWS_REGION: us-east-1
    ECR_REPO: earshot

phases:
  install:
    runtime-versions:
      python: 3.13
      nodejs: 22
    commands:
      - curl -LsSf https://astral.sh/uv/0.9.3/install.sh | sh
      - export PATH="$HOME/.local/bin:$PATH"
      - uv sync --frozen

  pre_build:
    commands:
      # Lint and test BEFORE the image build, so a broken commit fails in ~1 min not ~5.
      - uv run ruff check src tests tools benchmarks
      - uv run pytest
      - aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
      # Tag by commit sha: the digest promoted to demo must be traceable to a commit.
      - export IMAGE_TAG="${CODEBUILD_RESOLVED_SOURCE_VERSION:0:12}"

  build:
    commands:
      - docker build -t "$ECR_REGISTRY/$ECR_REPO:$IMAGE_TAG" .
      - docker push "$ECR_REGISTRY/$ECR_REPO:$IMAGE_TAG"
      # Resolve the immutable digest — CDK deploys the digest, never the tag, so a retag
      # cannot change what is already deployed.
      - export IMAGE_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$ECR_REGISTRY/$ECR_REPO:$IMAGE_TAG")
      - cd ui && npm ci && npm run build && cd ..

  post_build:
    commands:
      - cd infra && npm ci
      - uv sync --frozen --group infra
      - npx cdk deploy "Earshot/${STAGE:-dev}/*" --require-approval never -c imageDigest="$IMAGE_DIGEST"

artifacts:
  files:
    - imagedefinitions.json
  discard-paths: yes
