[project]
name = "genesis-2026"
version = "0.1.0"
description = "Zenon Genesis 2026 - Track A (Client-Facing Agentic AI) competition workspace"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
pythonpath = ["05_build"]
testpaths = ["05_build/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv"]
