[project]
name = "ear-on-every-call"
version = "0.2.0"
description = "Conversation signal layer for retail banks: a per-customer signal ledger plus an LLM investigator agent"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.11",
]

[project.scripts]
earshot = "earshot.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/earshot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["live: hits a real model over the network; deselected by default"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
exclude = [".venv"]
