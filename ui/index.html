<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ear on Every Call — reviewer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!--
    No build step, on purpose. CodeBuild is blocked (W9) and a demo must survive a room with no
    wifi and no toolchain (D-004), so this is three static files that open straight from disk.
    `data.js` is generated by tools/ui_fixture.py and assigns window.EARSHOT_DATA; a <script src>
    loads over file:// where a fetch() of a sibling JSON does not.
  -->
  <header class="topbar">
    <div class="brand">
      <span class="mark" aria-hidden="true">◎</span>
      <div>
        <h1>Ear on Every Call</h1>
        <p class="sub">Reviewer queue — a standing signal ledger, re-scored as conversations arrive</p>
      </div>
    </div>
    <nav id="crumbs" class="crumbs" aria-label="Breadcrumb"></nav>
  </header>

  <!-- Provenance, always on screen. A screenshot outlives the caveat someone says next to it. -->
  <div id="provenance" class="provenance" role="note"></div>

  <main id="view" class="view" tabindex="-1"></main>

  <footer class="foot">
    <p>
      Every score on this screen is computed by <code>memory.py</code>, the one scorer in the
      system. Nothing here re-derives one.
    </p>
  </footer>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
